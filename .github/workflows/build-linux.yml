name: Build Linux ARM

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-arm:
    runs-on: ubuntu-24.04-arm   # GitHub 原生 ARM64 运行环境
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖与工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y adb scrcpy shellcheck

      - name: 确认 ARM 原生环境
        run: |
          echo "架构: $(uname -m)"
          adb version | head -1
          scrcpy --version | head -1

      - name: 脚本语法检查 (shellcheck + bash -n)
        run: |
          shellcheck linux/phone-mirror.sh linux/install.sh || true
          bash -n linux/phone-mirror.sh
          bash -n linux/install.sh
          echo "语法检查通过"

      - name: 冒烟测试（无设备环境）
        run: |
          chmod +x linux/phone-mirror.sh linux/install.sh
          echo "--- help ---"
          ./linux/phone-mirror.sh help
          echo "--- list ---"
          ./linux/phone-mirror.sh list || true

      - name: 打包发布物
        run: |
          mkdir -p dist/phone-mirror-linux
          cp -r linux/* dist/phone-mirror-linux/
          cp README.md LICENSE THIRD_PARTY_NOTICES.md dist/phone-mirror-linux/ 2>/dev/null || true
          cd dist
          tar czf phone-mirror-assistant-linux-arm64.tar.gz phone-mirror-linux
          echo "打包完成:"
          tar tzf phone-mirror-assistant-linux-arm64.tar.gz

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/phone-mirror-assistant-linux-arm64.tar.gz
