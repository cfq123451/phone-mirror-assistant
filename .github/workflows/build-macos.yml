name: Build macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos-arm64:
    name: Build dmg (Apple Silicon / arm64)
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装打包依赖
        run: |
          pip install --quiet pyinstaller PySide6

      - name: 生成 .icns 图标
        run: |
          cd linux-gui
          mkdir -p icon.iconset
          sips -z 16 16 icons/app.png --out icon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 icons/app.png --out icon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 icons/app.png --out icon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 icons/app.png --out icon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 icons/app.png --out icon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 icons/app.png --out icon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 icons/app.png --out icon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 icons/app.png --out icon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 icons/app.png --out icon.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 icons/app.png --out icon.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns icon.iconset -o app.icns
          ls -lh app.icns

      - name: PyInstaller 打包 .app
        run: |
          pyinstaller --windowed --name "Phone Mirror Assistant" --icon linux-gui/app.icns --noconfirm linux-gui/phone-mirror-gui.py
          ls -lh dist/

      - name: 生成 .dmg
        run: |
          hdiutil create -volname "Phone Mirror Assistant" \
            -srcfolder "dist/Phone Mirror Assistant.app" \
            -ov -format UDZO dist/phone-mirror-assistant-macos-arm64-v2.2.2.dmg
          ls -lh dist/*.dmg

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/phone-mirror-assistant-macos-arm64-v2.2.2.dmg

  build-macos-x86_64:
    name: Build dmg (Intel / x86_64)
    runs-on: macos-13
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装打包依赖
        run: |
          pip install --quiet pyinstaller PySide6

      - name: 生成 .icns 图标
        run: |
          cd linux-gui
          mkdir -p icon.iconset
          sips -z 16 16 icons/app.png --out icon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 icons/app.png --out icon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 icons/app.png --out icon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 icons/app.png --out icon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 icons/app.png --out icon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 icons/app.png --out icon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 icons/app.png --out icon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 icons/app.png --out icon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 icons/app.png --out icon.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 icons/app.png --out icon.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns icon.iconset -o app.icns

      - name: PyInstaller 打包 .app
        run: |
          pyinstaller --windowed --name "Phone Mirror Assistant" --icon linux-gui/app.icns --noconfirm linux-gui/phone-mirror-gui.py

      - name: 生成 .dmg
        run: |
          hdiutil create -volname "Phone Mirror Assistant" \
            -srcfolder "dist/Phone Mirror Assistant.app" \
            -ov -format UDZO dist/phone-mirror-assistant-macos-x86_64-v2.2.2.dmg
          ls -lh dist/*.dmg

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/phone-mirror-assistant-macos-x86_64-v2.2.2.dmg
